        bg.src=POSTER;

    counter.style.display="block";

    counter.textContent=String(sec).padStart(2,"0");

}

function showPRAPOR(){

    if(bg.src!==PRAPOR)
        bg.src=PRAPOR;

    counter.style.display="none";

}

function update(){

    if(TEST_MODE){

        if(testStart===null)
            testStart=Date.now();

        const elapsed=Math.floor((Date.now()-testStart)/1000);

        if(elapsed<DURATION){

            showPoster(DURATION-elapsed);

        }else{

            showPRAPOR();

        }

        return;

    }

    const now=new Date();

    const current=
        now.getHours()*3600+
        now.getMinutes()*60+
        now.getSeconds();

    if(current>=START_SECONDS && current<END_SECONDS){

        showPoster(END_SECONDS-current);

    }else{

        showPRAPOR();

    }

}

update();

setInterval(update,250);

</script>

</body>
</html>
